# Every service pins `platform: linux/amd64` deliberately.
#
# Without it, the same tag resolves to a different binary per host: these images
# publish multi-arch manifests, so an Apple Silicon machine silently pulls the
# arm64 build while an x86_64 machine pulls amd64 — the classic "works on my
# machine" split, and the reason a clean-machine E2E run could stall at wallet
# sync while the chain looked healthy. Pinning amd64 makes every developer and
# CI runner execute the binaries this stack is actually verified against.
#
# Two consequences worth knowing:
#  * On Apple Silicon these run under emulation (Rosetta / QEMU). Expect
#    noticeably slower wallet sync and proving; the waits in src/api.ts are
#    bounded and will report a diagnostic rather than hang.
#  * indexer-standalone stopped publishing arm64 at 4.3.4, so without this pin a
#    bump past 4.3.3 fails on ARM at pull time with "no matching manifest for
#    linux/arm64/v8". With the pin, bumps work on every host.
services:
  proof-server:
    container_name: 'modular-proof-server'
    image: "midnightntwrk/proof-server:8.0.3"
    platform: linux/amd64
    command: ["midnight-proof-server -v"]
    ports:
      - "6300:6300"
    environment:
      RUST_BACKTRACE: "full"
    # No healthcheck: the proof-server image has no curl/shell to probe with.
    # Readiness is checked from the host by api.waitForProofServer (deploy
    # scripts) and by log-based wait strategies (testcontainers).
  indexer:
    container_name: 'modular-indexer'
    image: 'midnightntwrk/indexer-standalone:4.0.1'
    platform: linux/amd64
    ports:
      - '8088:8088'
    environment:
      RUST_LOG: 'indexer=debug,chain_indexer=debug,indexer_api=debug,wallet_indexer=debug,indexer_common=debug,fastrace_opentelemetry=off,info'
      APP__INFRA__NODE__URL: 'ws://node:9944'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
      APP__INFRA__STORAGE__PASSWORD: 'indexer'
      APP__INFRA__PUB_SUB__PASSWORD: 'indexer'
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: 'indexer'
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy
  node:
    image: 'midnightntwrk/midnight-node:0.22.2'
    platform: linux/amd64
    container_name: 'modular-node'
    ports:
      - "9944:9944"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9944/health" ]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 40s
    environment:
      CFG_PRESET: "dev"
